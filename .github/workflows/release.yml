name: Release gate

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
      - run: test "${GITHUB_REF_NAME#v}" = "$(go list -m -f '{{.Version}}' 2>/dev/null | sed 's/^v//' || true)" || test "${GITHUB_REF_NAME#v}" = "$(grep -o 'Version = \"[0-9.]*\"' client.go | cut -d\" -f2)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
